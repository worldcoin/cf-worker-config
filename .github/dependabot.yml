version: 2
registries:
  git-terraform-modules:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.WC_CICD_GITHUB_TOKEN }}
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[github-actions]"
    registries:
      - git-terraform-modules
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[Go]"
    registries:
      - git-terraform-modules
    groups:
      gomod:
        patterns:
          - "*"
