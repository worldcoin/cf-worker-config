name: Build and deploy (prod)
on:

  push:
    branches:
      - main

jobs:
  build-and-deploy-prod:
    environment: prod
    runs-on:
      group: arc-large-amd64-runner
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Build & Deploy prod
        uses: worldcoin/gh-actions/build-and-deploy@main
        with:
          aws_account_id: 012345678912
          aws_region: us-east-1
          eks_cluster_name: test-prod-cluster
          environment: prod
          aws_iam_role: oidc/github-deploy-go-template

          ecr_repo: go-template

